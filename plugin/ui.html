<!DOCTYPE html>
<html>
<head>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Inter, -apple-system, sans-serif;
      font-size: 11px;
      background: #2c2c2c;
      color: #fff;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 10px 12px;
      gap: 4px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #666;
    }
    .dot.connecting { background: #f59e0b; animation: pulse 1s infinite; }
    .dot.connected { background: #22c55e; }
    .dot.error { background: #ef4444; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .title { font-weight: 600; font-size: 12px; }
    #status { color: #aaa; }
    .hint { font-size: 9px; color: #666; margin-top: 2px; }
    #takeover {
      display: none;
      margin-top: 2px;
      font: inherit;
      font-size: 10px;
      color: #fff;
      background: #444;
      border: 0;
      border-radius: 3px;
      padding: 3px 6px;
      cursor: pointer;
      text-align: left;
    }
    #takeover:hover { background: #555; }
  </style>
</head>
<body>
  <div class="title">Figma DS CLI</div>
  <div class="row">
    <div id="dot" class="dot connecting"></div>
    <span id="status">Connecting...</span>
  </div>
  <div id="hint" class="hint">Keep this window open</div>
  <button id="takeover"></button>

  <script>
    // One daemon per CLI session (DAEMON_PORT), on ports 3456-3460. Ports are
    // tried in order and this window joins the first one that is free, so two
    // FigCli windows in two files land on two sessions instead of fighting over
    // one. A daemon that already serves another file answers "busy".
    const PORTS = [3456, 3457, 3458, 3459, 3460];
    const FILE = "__FIGCLI_FILE__"; // replaced by code.js
    const INSTANCE = Math.random().toString(36).slice(2) + Date.now().toString(36);
    let ws = null;
    let reconnectTimer = null;
    let keepaliveTimer = null;
    let scanning = false;
    const statusEl = document.getElementById('status');
    const dotEl = document.getElementById('dot');
    const hintEl = document.getElementById('hint');
    const takeoverEl = document.getElementById('takeover');

    function setStatus(text, state, hint) {
      statusEl.textContent = text;
      dotEl.className = 'dot ' + state;
      hintEl.textContent = hint || 'Keep this window open';
    }

    function showTakeover(busy) {
      if (!busy) { takeoverEl.style.display = 'none'; return; }
      takeoverEl.textContent = `Take over port ${busy.port} from “${busy.file}”`;
      takeoverEl.onclick = () => { showTakeover(null); scan(busy.port); };
      takeoverEl.style.display = 'block';
    }

    // Open one port and say hello. Resolves 'welcome' with the open socket,
    // 'busy' with the file that daemon serves, or 'none'. A daemon from before
    // this change never answers, but did accept the connection, so silence
    // after open counts as welcome.
    function tryPort(port, claim) {
      return new Promise(resolve => {
        let done = false;
        let socket;
        const finish = (result) => {
          if (done) return;
          done = true;
          clearTimeout(timer);
          socket.onopen = socket.onmessage = socket.onclose = socket.onerror = null;
          if (result.status !== 'welcome') { try { socket.close(); } catch {} }
          resolve(result);
        };
        const timer = setTimeout(() => finish({ status: 'none' }), 600);
        try { socket = new WebSocket(`ws://127.0.0.1:${port}/plugin`); }
        catch { clearTimeout(timer); resolve({ status: 'none' }); return; }

        socket.onopen = () => {
          socket.send(JSON.stringify({ type: 'hello', mode: 'plugin', version: '1.4.0', instance: INSTANCE, file: FILE, claim }));
          clearTimeout(timer);
          setTimeout(() => finish({ status: 'welcome', socket, port }), 500);
        };
        socket.onmessage = (event) => {
          let msg = {};
          try { msg = JSON.parse(event.data); } catch {}
          if (msg.type === 'welcome') finish({ status: 'welcome', socket, port });
          if (msg.type === 'busy') finish({ status: 'busy', port, file: msg.file || 'another file' });
        };
        socket.onclose = socket.onerror = () => finish({ status: 'none' });
      });
    }

    function adopt(socket, port) {
      ws = socket;
      ws.onmessage = handleMessage;
      ws.onclose = handleClose;
      ws.onerror = handleClose;
      showTakeover(null);
      setStatus(`Connected · port ${port}`, 'connected');
      parent.postMessage({ pluginMessage: { type: 'connected' } }, '*');
      startKeepalive();
    }

    // claimPort: take that port over even if it serves another file.
    async function scan(claimPort) {
      if (ws && ws.readyState === WebSocket.OPEN) return;
      if (scanning) return;
      scanning = true;
      clearTimeout(reconnectTimer);
      if (!claimPort) setStatus('Scanning...', 'connecting');

      const ports = claimPort ? [claimPort] : PORTS;
      let firstBusy = null;
      for (const port of ports) {
        const result = await tryPort(port, port === claimPort);
        if (result.status === 'welcome') {
          scanning = false;
          adopt(result.socket, result.port);
          return;
        }
        if (result.status === 'busy' && !firstBusy) firstBusy = result;
      }
      scanning = false;

      if (firstBusy) {
        // Every running session already has a file. Keep looking: a new session
        // starting its daemon on a free port is picked up on the next scan.
        setStatus('Waiting for a free CLI session', 'connecting', 'Start figma-cli with DAEMON_PORT=3457 in the other session');
        showTakeover(firstBusy);
        reconnectTimer = setTimeout(() => scan(), 2000);
      } else {
        showTakeover(null);
        reconnectTimer = setTimeout(() => scan(), 300);
      }
    }

    function handleMessage(event) {
      try {
        const msg = JSON.parse(event.data);

        if (msg.action === 'eval') {
          parent.postMessage({
            pluginMessage: { type: 'eval', id: msg.id, code: msg.code }
          }, '*');
        }

        // Batch eval support
        if (msg.action === 'eval-batch') {
          parent.postMessage({
            pluginMessage: { type: 'eval-batch', id: msg.id, codes: msg.codes }
          }, '*');
        }

        // Daemon pings us
        if (msg.action === 'ping') {
          ws.send(JSON.stringify({ type: 'pong', id: msg.id }));
        }

        // Daemon responds to our ping
        if (msg.type === 'pong') {
          lastPong = Date.now();
        }

        // Another FigCli window took over our port on purpose
        if (msg.type === 'replaced') {
          setStatus(`Replaced on port ${msg.port}`, 'connecting', `Now serving “${msg.file}”. Looking for a free session…`);
        }
      } catch (e) {
        console.error('Message parse error:', e);
      }
    }

    function handleClose() {
      // Only show reconnecting if we were the active connection
      if (ws && ws.readyState !== WebSocket.OPEN) {
        ws = null;
        setStatus('Reconnecting...', 'connecting');
        stopKeepalive();
        parent.postMessage({ pluginMessage: { type: 'disconnected' } }, '*');

        // Fast reconnect (200ms)
        clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(() => scan(), 200);
      }
    }

    let lastPong = Date.now();

    function startKeepalive() {
      stopKeepalive();
      lastPong = Date.now();
      keepaliveTimer = setInterval(() => {
        if (ws && ws.readyState === WebSocket.OPEN) {
          // Check if we got a pong recently (within 8s for faster detection)
          if (Date.now() - lastPong > 8000) {
            console.log('No pong received, reconnecting...');
            ws.close();
            return;
          }
          ws.send(JSON.stringify({ type: 'ping' }));
        }
      }, 3000);  // Ping every 3s for faster dead connection detection
    }

    function stopKeepalive() {
      if (keepaliveTimer) {
        clearInterval(keepaliveTimer);
        keepaliveTimer = null;
      }
    }

    // Legacy function name for compatibility
    function connect() { scan(); }

    // Receive results from plugin main thread
    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === 'result') {
        // Send result back to CLI via WebSocket
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({
            type: 'result',
            id: msg.id,
            result: msg.result,
            error: msg.error
          }));
        }
      }

      // Batch result forwarding (CRITICAL for render-batch stability)
      if (msg.type === 'batch-result') {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({
            type: 'batch-result',
            id: msg.id,
            results: msg.results
          }));
        }
      }
    };

    // Start connection
    connect();
  </script>
</body>
</html>
